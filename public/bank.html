<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155BFF"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><link rel="icon" href="/assets/favicon-64.png"><link rel="stylesheet" href="/styles.css"><title>Banque • MCO Quiz Arena</title></head><body><div id="root"></div><script src="/common.js"></script><script>(async()=>{const root=document.getElementById('root');try{const c=await API.get('/api/catalog');let cards='';for(const [year,yv] of Object.entries(c.years)){for(const [subject,sv] of Object.entries(yv.subjects)){let rows='';for(const [chapter,chv] of Object.entries(sv.chapters)){const count=Object.values(chv.lessons).reduce((a,b)=>a+b,0);rows+=`<div class="bank-row"><div><strong>${esc(chapter)}</strong><div class="muted">${Object.keys(chv.lessons).map(esc).join(' • ')}</div></div><strong>${count}</strong></div>`}cards+=`<section class="card bank-section"><div class="eyebrow">${subject} • ${year}</div><h2>${subject} — ${year==='1A'?'1re année':'2e année'}</h2>${rows}</section>`}}const content=`<h1>Banque de questions</h1><p class="muted">Toute la structure pédagogique est disponible pour préparer un quiz ciblé.</p><div class="dashboard-cards"><div class="metric"><strong>${c.total}</strong><span>questions</span></div><div class="metric"><strong>156</strong><span>leçons</span></div><div class="metric"><strong>4</strong><span>parcours</span></div><div class="metric"><strong>52</strong><span>chapitres</span></div></div><div class="notice" style="margin:0 0 20px">✅ Niveau → matière → chapitre → leçon → difficulté → question → réponses → correction.</div><div class="bank-grid">${cards}</div>`;root.innerHTML=teacherShell('bank',content,'Banque de questions')}catch(e){root.innerHTML=teacherShell('bank',`<div class="card dash-card"><h1>Erreur</h1><p>${esc(e.message)}</p></div>`,'Banque de questions')}})();</script></body></html>
