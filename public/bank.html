<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banque • MCO Quiz Arena</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/icon-192.png"><link rel="stylesheet" href="/styles.css"></head><body><div id="root"></div><script src="/common.js"></script><script>
(async()=>{const root=document.getElementById('root');try{const c=await API.get('/api/catalog');let cards='';for(const [year,yv] of Object.entries(c.years)){for(const [subject,sv] of Object.entries(yv.subjects)){let rows='';for(const [chapter,chv] of Object.entries(sv.chapters)){const count=Object.values(chv.lessons).reduce((a,b)=>a+b,0);rows+=`<div class="bank-row"><div><strong>${esc(chapter)}</strong><div class="muted">${Object.keys(chv.lessons).map(esc).join(' • ')}</div></div><strong>${count}</strong></div>`}cards+=`<section class="card bank-section"><div class="eyebrow">${subject} • ${year}</div><h2>${subject} — ${year==='1A'?'1re année':'2e année'}</h2>${rows}</section>`}}root.innerHTML=nav('bank')+`<main class="page"><div class="eyebrow">🗂️ STRUCTURE DE LA BANQUE</div><h1 style="font-size:44px;margin:12px 0 6px">Banque de questions</h1><p class="muted">Le moteur sait déjà filtrer par niveau, matière, chapitre, leçon et difficulté. <strong>La banque contient <strong>${c.total} questions</strong> issues des supports V18 et de la banque manuelle validée.</p><div class="notice" style="margin:22px 0">✅ Banque injectée : 1A/2A → ADOC/GO → chapitre → leçon → difficulté → question → réponses → correction pédagogique.</div><div class="bank-grid">${cards}</div></main>`+footer()}catch(e){root.innerHTML=nav('bank')+`<main class="page"><div class="join-card card"><h1>Erreur</h1><p>${esc(e.message)}</p></div></main>`+footer()}})();
</script></body></html>
