<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rejoindre • MCO Quiz Arena</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/icon-192.png"><link rel="stylesheet" href="/styles.css"></head><body><div id="root"></div><script src="/common.js"></script><script>
const root=document.getElementById('root');const initial=qs('code')||'';root.innerHTML=nav('join')+`<main class="page"><div class="join-card card center"><img class="mascot" src="/assets/app-icon.png"><div class="eyebrow">📱 ÉLÈVE</div><h1>Rejoins la partie</h1><p class="muted">Saisis le code affiché par ton professeur puis choisis ton pseudo.</p><div class="field"><label>Code de partie</label><input id="code" maxlength="5" autocomplete="off" value="${esc(initial)}" style="text-transform:uppercase;text-align:center;font-size:26px;font-weight:900;letter-spacing:.1em"></div><div class="field"><label>Ton pseudo</label><input id="name" maxlength="24" autocomplete="nickname" placeholder="Ex. TeamNCR ⚡"></div><button class="btn primary" id="joinBtn">Rejoindre</button><div class="muted" style="font-size:12px;margin-top:14px">Aucun compte nécessaire pour jouer en classe.</div></div></main>`+footer();
document.getElementById('joinBtn').onclick=async()=>{const code=document.getElementById('code').value.trim().toUpperCase();const name=document.getElementById('name').value.trim();if(code.length!==5)return toast('Code à 5 caractères','bad');if(!name)return toast('Choisis un pseudo','bad');try{const r=await API.post(`/api/sessions/${code}/join`,{name});localStorage.setItem(`mco_player_${code}`,r.playerId);location.href=`/play.html?code=${code}&playerId=${r.playerId}`}catch(e){toast(e.message,'bad')}};
</script></body></html>
